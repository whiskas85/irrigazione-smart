name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Il controllo "brands" pretende che il dominio sia registrato in
          # home-assistant/brands, cosa che vale solo per le integration del
          # catalogo ufficiale. Questa è un'integration personalizzata e
          # porta le proprie icone in `brand/`.
          ignore: brands

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # versione fissata: un aggiornamento di ruff non deve far fallire la
      # CI su codice che non è cambiato
      - run: pip install ruff==0.16.0
      - run: ruff check custom_components scripts
